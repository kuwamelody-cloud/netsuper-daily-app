<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ネットスーパー日報メモ</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #059669;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(244,246,248,.94);
      backdrop-filter: blur(8px);
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: .02em;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 80px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(209,213,219,.7);
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      font-size: 17px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }
    input[type="number"] { text-align: right; }
    textarea { min-height: 84px; resize: vertical; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: end;
    }
    .route-row {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .route-head {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .summary .box {
      background: #eef2ff;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      border: 1px solid #c7d2fe;
    }
    .summary .wide { grid-column: 1 / -1; }
    .summary .num {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent-dark);
    }
    .summary .cap {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    button, .button-link {
      width: 100%;
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .primary { background: var(--accent); color: white; }
    .primary:active { background: var(--accent-dark); }
    .secondary { background: #e5e7eb; color: #111827; }
    .danger { background: #fee2e2; color: var(--danger); }
    .success { background: #d1fae5; color: var(--success); }
    .small-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .status {
      font-size: 13px;
      color: var(--success);
      min-height: 20px;
      margin-top: 8px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 6px;
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    .table-wrap { overflow-x: auto; }
    .mini-table th, .mini-table td { text-align: center; }
    .mini-table th:first-child, .mini-table td:first-child { text-align: left; }
    .row-actions button {
      font-size: 12px;
      padding: 7px 8px;
      border-radius: 9px;
      display: inline-block;
      width: auto;
      margin-left: 4px;
    }
    .hidden { display: none; }
    @media (min-width: 640px) {
      .buttons { grid-template-columns: repeat(2, 1fr); }
      .summary { grid-template-columns: repeat(4, 1fr); }
      .summary .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ネットスーパー日報メモ</h1>
  </header>

  <main>
    <section class="card">
      <p class="section-title">基本情報</p>
      <div class="grid2">
        <div>
          <label for="workDate">日付 <span id="weekdayLabel" style="color:#2563eb;font-weight:800;"></span></label>
          <input id="workDate" type="date" />
        </div>
        <div>
          <label for="storeName">稼働店舗名</label>
          <input id="storeName" type="text" placeholder="例：〇〇店" list="storeList" />
          <datalist id="storeList"></datalist>
        </div>
      </div>
    </section>

    <section class="card">
      <p class="section-title">各便の件数・個数</p>
      <div id="routes"></div>
      <div class="summary">
        <div class="box">
          <div class="num" id="totalCases">0</div>
          <div class="cap">合計件数</div>
        </div>
        <div class="box">
          <div class="num" id="totalItems">0</div>
          <div class="cap">合計個数</div>
        </div>
      </div>
    </section>

    <section class="card">
      <p class="section-title">車両メーター</p>
      <div class="grid2">
        <div>
          <label for="startMeter">開始メーター</label>
          <input id="startMeter" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0" />
        </div>
        <div>
          <label for="endMeter">終了メーター</label>
          <input id="endMeter" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0" />
        </div>
      </div>
      <div class="summary" style="margin-top:10px;">
        <div class="box wide">
          <div class="num" id="distanceKm">0</div>
          <div class="cap">走行距離 km</div>
        </div>
      </div>
      <div id="meterWarning" class="small-note"></div>
    </section>

    <section class="card">
      <p class="section-title">メモ</p>
      <textarea id="memo" placeholder="任意：特記事項など"></textarea>
    </section>

    <section class="card">
      <p class="section-title">保存・送信</p>
      <label for="emailAddress">送信先メールアドレス</label>
      <input id="emailAddress" type="email" placeholder="your@example.com" />
      <div class="buttons">
        <button class="primary" id="saveBtn">今日の記録を保存</button>
        <button class="success" id="mailBtn">メール本文を作成</button>
        <button class="secondary" id="clearBtn">入力をクリア</button>
        <button class="danger" id="deleteBtn">この日の保存を削除</button>
      </div>
      <div id="status" class="status"></div>
      <p class="small-note">メール送信は端末のメールアプリを開く方式です。最後の送信ボタンは自分で押してください。</p>
    </section>

    <section class="card">
      <p class="section-title">月別一覧・CSV出力</p>
      <div class="grid2">
        <div>
          <label for="monthSelect">表示月</label>
          <input id="monthSelect" type="month" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="secondary" id="csvBtn">この月をCSV出力</button>
        </div>
      </div>
      <div class="summary" style="margin-top:10px;">
        <div class="box"><div class="num" id="monthDays">0</div><div class="cap">稼働日数</div></div>
        <div class="box"><div class="num" id="monthCases">0</div><div class="cap">月間件数</div></div>
        <div class="box"><div class="num" id="monthItems">0</div><div class="cap">月間個数</div></div>
        <div class="box"><div class="num" id="monthDistance">0</div><div class="cap">月間km</div></div>
        <div class="box wide"><div class="num" id="avgDistance">0</div><div class="cap">1日平均km</div></div>
      </div>
      <div class="table-wrap" style="margin-top:12px;">
        <table class="mini-table">
          <thead>
            <tr><th>便</th><th>1便</th><th>2便</th><th>3便</th><th>4便</th><th>5便</th><th>6便</th></tr>
          </thead>
          <tbody>
            <tr id="routeAvgCasesRow"><td>平均件数</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-wrap" style="margin-top:12px;">
        <table>
          <thead>
            <tr><th>日付</th><th>店舗</th><th>件数</th><th>個数</th><th>km</th><th>操作</th></tr>
          </thead>
          <tbody id="monthTable"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
(function() {
  const STORAGE_KEY = 'netsuperDailyRecords_v1';
  const SETTINGS_KEY = 'netsuperDailySettings_v1';
  const $ = id => document.getElementById(id);

  const fields = ['workDate','storeName','startMeter','endMeter','memo','emailAddress','monthSelect'];
  const routeWrap = $('routes');

  for (let i = 1; i <= 6; i++) {
    const row = document.createElement('div');
    row.className = 'route-row';
    row.innerHTML = `
      <div class="route-head">${i}便</div>
      <div class="grid2">
        <div><label for="r${i}Cases">件数</label><input id="r${i}Cases" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
        <div><label for="r${i}Items">個数</label><input id="r${i}Items" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      </div>`;
    routeWrap.appendChild(row);
  }

  function todayLocal() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }


  function weekdayJa(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const names = ['日', '月', '火', '水', '木', '金', '土'];
    return `（${names[date.getDay()]}）`;
  }

  function updateWeekday() {
    const el = $('weekdayLabel');
    if (el) el.textContent = weekdayJa($('workDate').value);
  }

  function currentMonth() { return todayLocal().slice(0, 7); }
  function num(id) { return Number($(id).value || 0); }
  function fmt(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10); }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveSettings(settings) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

  function calc() {
    let totalCases = 0;
    let totalItems = 0;
    for (let i = 1; i <= 6; i++) {
      totalCases += num(`r${i}Cases`);
      totalItems += num(`r${i}Items`);
    }
    const start = num('startMeter');
    const end = num('endMeter');
    const distance = Math.max(0, Math.round((end - start) * 10) / 10);
    $('totalCases').textContent = totalCases;
    $('totalItems').textContent = totalItems;
    $('distanceKm').textContent = fmt(distance);
    $('meterWarning').textContent = end && start && end < start ? '終了メーターが開始メーターより小さくなっています。' : '';
    return { totalCases, totalItems, distance };
  }

  function getFormData() {
    const routes = [];
    for (let i = 1; i <= 6; i++) {
      routes.push({ cases: num(`r${i}Cases`), items: num(`r${i}Items`) });
    }
    const totals = calc();
    return {
      date: $('workDate').value,
      weekday: weekdayJa($('workDate').value),
      storeName: $('storeName').value.trim(),
      routes,
      totalCases: totals.totalCases,
      totalItems: totals.totalItems,
      startMeter: num('startMeter'),
      endMeter: num('endMeter'),
      distance: totals.distance,
      memo: $('memo').value.trim(),
      updatedAt: new Date().toISOString()
    };
  }

  function setFormData(data) {
    $('workDate').value = data.date || todayLocal();
    updateWeekday();
    $('storeName').value = data.storeName || '';
    for (let i = 1; i <= 6; i++) {
      const r = data.routes?.[i - 1] || {};
      $(`r${i}Cases`).value = r.cases || '';
      $(`r${i}Items`).value = r.items || '';
    }
    $('startMeter').value = data.startMeter || '';
    $('endMeter').value = data.endMeter || '';
    $('memo').value = data.memo || '';
    calc();
  }

  function clearForm(keepDate = true) {
    const date = keepDate ? $('workDate').value : todayLocal();
    const settings = loadSettings();
    const currentStoreName = $('storeName').value.trim();
    const currentEmailAddress = $('emailAddress').value.trim();
    setFormData({
      date,
      storeName: currentStoreName || settings.lastStoreName || '',
      routes: Array.from({length: 6}, () => ({cases:0, items:0})),
      startMeter: 0,
      endMeter: 0,
      memo: ''
    });
    $('emailAddress').value = currentEmailAddress || settings.emailAddress || '';
  }

  function saveCurrent(options = {}) {
    const data = getFormData();
    if (!data.date) { setStatus('日付を入力してください。', true); return false; }
    const records = loadRecords();
    const exists = Boolean(records[data.date]);
    if (exists && !options.skipConfirm) {
      const ok = confirm(`${data.date}${weekdayJa(data.date)} の保存データは既にあります。上書き保存しますか？`);
      if (!ok) { setStatus('保存をキャンセルしました。', true); return false; }
    }
    records[data.date] = data;
    saveRecords(records);

    const settings = loadSettings();
    settings.emailAddress = $('emailAddress').value.trim();
    settings.lastStoreName = data.storeName;
    saveSettings(settings);
    updateStoreList();
    renderMonth();
    setStatus(exists ? '上書き保存しました。' : '保存しました。');
    return true;
  }

  function loadByDate(date) {
    const records = loadRecords();
    if (records[date]) setFormData(records[date]);
    else clearForm(true);
  }

  function deleteCurrent() {
    const date = $('workDate').value;
    if (!date) return;
    if (!confirm(`${date} の保存データを削除しますか？`)) return;
    const records = loadRecords();
    delete records[date];
    saveRecords(records);
    clearForm(true);
    renderMonth();
    setStatus('削除しました。');
  }

  function makeMailBody(data) {
    const lines = [];
    lines.push('ネットスーパー日報メモ');
    lines.push('');
    lines.push(`日付：${data.date}${weekdayJa(data.date)}`);
    lines.push(`店舗：${data.storeName || '-'}`);
    lines.push('');
    for (let i = 1; i <= 6; i++) {
      const r = data.routes[i - 1];
      lines.push(`${i}便：${r.cases}件 / ${r.items}個`);
    }
    lines.push('');
    lines.push(`合計件数：${data.totalCases}件`);
    lines.push(`合計個数：${data.totalItems}個`);
    lines.push('');
    lines.push(`開始メーター：${data.startMeter}`);
    lines.push(`終了メーター：${data.endMeter}`);
    lines.push(`走行距離：${fmt(data.distance)}km`);
    if (data.memo) {
      lines.push('');
      lines.push(`メモ：${data.memo}`);
    }
    return lines.join('\n');
  }

  function openMail() {
    if (!saveCurrent()) return;
    const data = getFormData();
    const email = $('emailAddress').value.trim();
    if (!email) return setStatus('送信先メールアドレスを入力してください。', true);
    const subject = `ネットスーパー日報 ${data.date} ${data.storeName || ''}`.trim();
    const body = makeMailBody(data);
    const href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = href;
  }

  function setStatus(msg, isError = false) {
    $('status').style.color = isError ? 'var(--danger)' : 'var(--success)';
    $('status').textContent = msg;
    setTimeout(() => { if ($('status').textContent === msg) $('status').textContent = ''; }, 3500);
  }

  function renderMonth() {
    const month = $('monthSelect').value || currentMonth();
    const records = loadRecords();
    const rows = Object.values(records)
      .filter(r => r.date && r.date.startsWith(month))
      .sort((a,b) => a.date.localeCompare(b.date));

    let cases = 0, items = 0, distance = 0;
    const routeCases = Array.from({ length: 6 }, () => 0);
    const tbody = $('monthTable');
    tbody.innerHTML = '';
    rows.forEach(r => {
      cases += r.totalCases || 0;
      items += r.totalItems || 0;
      distance += r.distance || 0;
      for (let i = 0; i < 6; i++) routeCases[i] += r.routes?.[i]?.cases || 0;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.date.slice(5).replace('-', '/')}${weekdayJa(r.date)}</td>
        <td>${escapeHtml(r.storeName || '-')}</td>
        <td>${r.totalCases || 0}</td>
        <td>${r.totalItems || 0}</td>
        <td>${fmt(r.distance || 0)}</td>
        <td class="row-actions"><button class="secondary" data-load="${r.date}">開く</button></td>`;
      tbody.appendChild(tr);
    });
    $('monthDays').textContent = rows.length;
    $('monthCases').textContent = cases;
    $('monthItems').textContent = items;
    $('monthDistance').textContent = fmt(Math.round(distance * 10) / 10);
    $('avgDistance').textContent = rows.length ? fmt(Math.round((distance / rows.length) * 10) / 10) : '0';
    const avgCells = $('routeAvgCasesRow').querySelectorAll('td');
    for (let i = 0; i < 6; i++) {
      avgCells[i + 1].textContent = rows.length ? fmt(Math.round((routeCases[i] / rows.length) * 10) / 10) : '0';
    }

    tbody.querySelectorAll('[data-load]').forEach(btn => {
      btn.addEventListener('click', () => {
        $('workDate').value = btn.dataset.load;
        loadByDate(btn.dataset.load);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  function csvEscape(v) {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function exportCsv() {
    const month = $('monthSelect').value || currentMonth();
    const records = loadRecords();
    const rows = Object.values(records)
      .filter(r => r.date && r.date.startsWith(month))
      .sort((a,b) => a.date.localeCompare(b.date));
    if (!rows.length) return setStatus('この月の保存データがありません。', true);

    const header = ['日付','曜日','店舗名'];
    for (let i = 1; i <= 6; i++) header.push(`${i}便件数`, `${i}便個数`);
    header.push('合計件数','合計個数','開始メーター','終了メーター','走行距離km','メモ');

    const lines = [header.map(csvEscape).join(',')];
    rows.forEach(r => {
      const line = [r.date, weekdayJa(r.date).replace(/[（）]/g, ''), r.storeName || ''];
      for (let i = 0; i < 6; i++) {
        line.push(r.routes?.[i]?.cases || 0, r.routes?.[i]?.items || 0);
      }
      line.push(r.totalCases || 0, r.totalItems || 0, r.startMeter || 0, r.endMeter || 0, r.distance || 0, r.memo || '');
      lines.push(line.map(csvEscape).join(','));
    });

    const bom = '\uFEFF';
    const blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `netsuper_daily_${month}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('CSVを出力しました。');
  }

  function updateStoreList() {
    const records = loadRecords();
    const names = new Set(Object.values(records).map(r => r.storeName).filter(Boolean));
    const settings = loadSettings();
    if (settings.lastStoreName) names.add(settings.lastStoreName);
    $('storeList').innerHTML = [...names].sort().map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  }


  function persistSettings() {
    const settings = loadSettings();
    const email = $('emailAddress').value.trim();
    const store = $('storeName').value.trim();
    if (email) settings.emailAddress = email;
    if (store) settings.lastStoreName = store;
    saveSettings(settings);
    updateStoreList();
  }

  function init() {
    const settings = loadSettings();
    $('workDate').value = todayLocal();
    updateWeekday();
    $('monthSelect').value = currentMonth();
    $('emailAddress').value = settings.emailAddress || '';
    if (settings.lastStoreName) $('storeName').value = settings.lastStoreName;
    updateStoreList();
    loadByDate($('workDate').value);
    renderMonth();

    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', calc);
    });
    for (let i = 1; i <= 6; i++) {
      $(`r${i}Cases`).addEventListener('input', calc);
      $(`r${i}Items`).addEventListener('input', calc);
    }
    $('storeName').addEventListener('change', persistSettings);
    $('storeName').addEventListener('blur', persistSettings);
    $('emailAddress').addEventListener('change', persistSettings);
    $('emailAddress').addEventListener('blur', persistSettings);
    $('workDate').addEventListener('change', e => { updateWeekday(); loadByDate(e.target.value); });
    $('monthSelect').addEventListener('change', renderMonth);
    $('saveBtn').addEventListener('click', () => saveCurrent());
    $('mailBtn').addEventListener('click', openMail);
    $('clearBtn').addEventListener('click', () => { clearForm(true); setStatus('入力欄をクリアしました。店舗名とメールアドレスは保持しています。'); });
    $('deleteBtn').addEventListener('click', deleteCurrent);
    $('csvBtn').addEventListener('click', exportCsv);
  }

  init();
})();
</script>
</body>
</html>
